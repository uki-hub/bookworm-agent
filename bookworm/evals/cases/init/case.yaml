schema_version: "1.0"
name: init
description: init creates .bookworm (hidden from source git) and drafts a useful overview from the survey.
tags: [smoke, acceptance-1]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bookworm:init
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 1
graders:
  - type: file_exists
    name: config created
    path: .bookworm/bookworm.json
  - type: file_exists
    name: overview drafted
    path: .bookworm/context.md
  - type: regex
    name: overview has run/test commands
    target: { source: file, path: .bookworm/context.md }
    pattern: "npm run (build|lint)"
  - type: tool_used
    name: no helper source reads
    tool: Read
    input_match: 'bw\.py|bwlib'
    min: 0
    max: 0
    arm: both
  - type: llm
    name: overview accuracy
    focus: { source: file, path: .bookworm/context.md }
    criteria: >
      The overview says the app is a small kanban/task board with todo, doing and done columns, maps the
      src folders (state, ui, pages, lib) and lists npm run build and npm run lint. It invents no features.
