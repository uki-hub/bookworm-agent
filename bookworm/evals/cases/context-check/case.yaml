schema_version: "1.0"
name: context-check
description: context-check finds the injected drift, writes only the findings cache, and never edits files.
tags: [acceptance-4, read-only]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bookworm:context-check board
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 1
graders:
  - type: regex
    name: reports stale
    target: last_message
    pattern: "stale"
    flags: i
  - type: regex
    name: names the new limit
    target: last_message
    pattern: "WIP_LIMIT|limit"
    flags: i
  - type: file_exists
    name: findings cached
    path: .bookworm/.cache/findings/board.md
  - type: tool_used
    name: no Write
    tool: Write
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no Edit
    tool: Edit
    min: 0
    max: 0
    arm: both
