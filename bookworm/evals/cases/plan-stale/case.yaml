schema_version: "1.0"
name: plan-stale
description: plan on a stale context saves the task, reports needs_review and names the fix.
tags: [acceptance-6]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/bookworm:plan Allow reassigning a task owner from the board. Acceptance: npm run build passes. --yes"
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 1
graders:
  - type: regex
    name: needs_review reported
    target: last_message
    pattern: "needs_review"
  - type: regex
    name: fix named
    target: last_message
    pattern: "context-update board"
  - type: tool_used
    name: task created by bw
    tool: Bash
    input_match: "bw task new"
    min: 1
  - type: tool_used
    name: no source edits
    tool: Edit
    input_match: "src[\\/]"
    min: 0
    max: 0
    arm: both
